name: LittleBitChat CPU verification
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify migrated 160-test LittleBit engine
        run: python -m unittest discover -s engine/tests -q
      - name: Verify standalone chat tests
        run: python -m unittest discover -s tests -v
      - name: Verify readiness and missing-checkpoint gate
        run: |
          python littlebitchat.py status --json
          python littlebitchat.py preflight > /tmp/littlebit_preflight.json
          python -c 'import json; x=json.load(open("/tmp/littlebit_preflight.json")); assert x["projection_count"] == 434 and not x["runnable_model"]'

  qat-layer:
    name: Train and verify one LittleBit-2 projection (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install base dependencies
        run: python -m pip install -r requirements.txt
      - name: Install CPU-only PyTorch for training
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify Joint-ITQ, QAT, resume, real BF16 reader and packed export
        run: python -m unittest discover -s training/tests -v
      - name: Verify standalone training command
        run: |
          python littlebitchat.py train demo --steps 8 --rank 8 --device cpu --out /tmp/littlebit-qat
          python -c 'import json,pathlib; x=json.loads(next(pathlib.Path("/tmp/littlebit-qat").glob("*_step_*.json")).read_text()); assert x["status"] == "LAYER_QAT_EXPORTED" and x["packed_inference_verified"] and not x["full_model_trained"]'
